name: Check VPN engine updates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test the read-only update checker
        run: python3 -m unittest discover -s tools/tests -v
      - name: Compare pinned engines with their upstream versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_upstream.py --summary "$GITHUB_STEP_SUMMARY"
